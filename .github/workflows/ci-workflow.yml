name: "CI Tests"
on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    name: "Elixir ${{matrix.elixir}} OTP ${{matrix.otp}}"
    strategy:
      fail-fast: false
      matrix:
        otp: [25.3, 26.2, 27.3, 28.1, 29.0]
        elixir: [1.16.2, 1.17.3, 1.18.4, 1.19.5, 1.20.2]
        exclude:
          - elixir: 1.16.2
            otp: 27.3
          - elixir: 1.16.2
            otp: 28.1
          - elixir: 1.16.2
            otp: 29.0
          - elixir: 1.17.3
            otp: 28.1
          - elixir: 1.17.3
            otp: 29.0
          - elixir: 1.18.4
            otp: 28.1
          - elixir: 1.19.5
            otp: 25.3
          - elixir: 1.20.2
            otp: 25.3
          - elixir: 1.20.2
            otp: 26.2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix dialyzer --halt-exit-status

  quality:
    runs-on: ubuntu-24.04
    name: "Quality gates"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.1"
          elixir-version: "1.19.5"
      - run: mix deps.get
      - name: Format
        run: mix format --check-formatted
      - name: Credo
        if: ${{ !cancelled() }}
        run: mix credo --strict
      - name: Sobelow
        if: ${{ !cancelled() }}
        run: mix sobelow --skip --exit low
      - name: Coverage (minimum 90%)
        if: ${{ !cancelled() }}
        run: mix test --cover

  agents:
    runs-on: ubuntu-24.04
    name: "Agent definitions in sync"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/agents/generate.py --check
